<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#080808">
  <title>Athlete Sponsorship Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #080808; color: #f5f1e8; }

  <main>
    <h1>Athlete Sponsorship <span>Portal</span></h1>
